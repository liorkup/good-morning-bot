name: Good Morning Bot 🌅

on:
  schedule:
    - cron: '0 5 * * *'  # 08:00 Israel time (UTC+3)
  workflow_dispatch:       # allows manual run from GitHub

jobs:
  send-good-morning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Good Morning Message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python good_morning.py
